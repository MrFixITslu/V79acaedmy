<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#f8fafc"/>
<rect width="1200" height="190" fill="#312e81"/>
<text x="70" y="78" font-family="Arial" font-size="54" font-weight="900" fill="#fff">AI Operator Skills Map</text>
<text x="70" y="128" font-family="Arial" font-size="25" font-weight="600" fill="#e0e7ff">What a V79 Junior AI graduate should be able to do independently</text>
<rect x="80" y="245" width="1040" height="112" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="145" cy="301" r="40" fill="#4f46e5"/><text x="145" y="315" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#fff">1</text><text x="220" y="288" font-family="Arial" font-size="28" font-weight="900" fill="#0f172a">DEFINE</text><text x="220" y="323" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Name the real result you need before asking AI.</text><rect x="80" y="390" width="1040" height="112" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="145" cy="446" r="40" fill="#7c3aed"/><text x="145" y="460" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#fff">2</text><text x="220" y="433" font-family="Arial" font-size="28" font-weight="900" fill="#0f172a">CHOOSE</text><text x="220" y="468" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Choose AI, search, calculator, spreadsheet, design tool or human judgment.</text><rect x="80" y="535" width="1040" height="112" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="145" cy="591" r="40" fill="#2563eb"/><text x="145" y="605" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#fff">3</text><text x="220" y="578" font-family="Arial" font-size="28" font-weight="900" fill="#0f172a">OPERATE</text><text x="220" y="613" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Generate • summarize • extract • transform • compare • explain • critique • plan.</text><rect x="80" y="680" width="1040" height="112" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="145" cy="736" r="40" fill="#0891b2"/><text x="145" y="750" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#fff">4</text><text x="220" y="723" font-family="Arial" font-size="28" font-weight="900" fill="#0f172a">PROMPT</text><text x="220" y="758" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Give useful context, constraints, audience, examples and output format.</text><rect x="80" y="825" width="1040" height="112" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="145" cy="881" r="40" fill="#0d9488"/><text x="145" y="895" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#fff">5</text><text x="220" y="868" font-family="Arial" font-size="28" font-weight="900" fill="#0f172a">MANAGE CONTEXT</text><text x="220" y="903" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Continue, compress context or start a clean chat when instructions become messy.</text><rect x="80" y="970" width="1040" height="112" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="145" cy="1026" r="40" fill="#16a34a"/><text x="145" y="1040" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#fff">6</text><text x="220" y="1013" font-family="Arial" font-size="28" font-weight="900" fill="#0f172a">CHECK</text><text x="220" y="1048" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Verify facts, instructions, uncertainty, privacy, permission and quality.</text><rect x="80" y="1115" width="1040" height="112" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="145" cy="1171" r="40" fill="#ca8a04"/><text x="145" y="1185" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#fff">7</text><text x="220" y="1158" font-family="Arial" font-size="28" font-weight="900" fill="#0f172a">IMPROVE</text><text x="220" y="1193" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Fix the weak part with a focused follow-up instead of restarting blindly.</text><rect x="80" y="1260" width="1040" height="112" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="145" cy="1316" r="40" fill="#ea580c"/><text x="145" y="1330" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#fff">8</text><text x="220" y="1303" font-family="Arial" font-size="28" font-weight="900" fill="#0f172a">SAVE & REUSE</text><text x="220" y="1338" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Keep good prompts, checklists and workflows in your AI Playbook.</text>
<text x="80" y="1450" font-family="Arial" font-size="25" font-weight="900" fill="#312e81">Graduate test:</text>
<text x="80" y="1490" font-family="Arial" font-size="22" font-weight="600" fill="#475569">Can you use this process on a brand-new task and explain every decision without copying a class example?</text>
<text x="80" y="1550" font-family="Arial" font-size="20" font-weight="700" fill="#64748b">V79 Junior AI Academy • Efficient AI use = better decisions, fewer blind retries, stronger checking.</text>
</svg>