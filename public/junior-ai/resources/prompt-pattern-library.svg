<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="170" fill="#7c3aed"/><text x="65" y="72" font-family="Arial" font-size="50" font-weight="900" fill="#fff">Reusable Prompt Pattern Library</text><text x="65" y="120" font-family="Arial" font-size="24" font-weight="600" fill="#fff">Save structures that work. Change the details for each new task.</text><rect x="65" y="230" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="278" font-family="Arial" font-size="28" font-weight="800" fill="#7c3aed">GENERATE — Give me ___ options for ___ audience. Constraints: ___. Format: ___.</text><line x1="95" y1="312" x2="1100" y2="312" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="352" x2="1100" y2="352" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="412" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="460" font-family="Arial" font-size="28" font-weight="800" fill="#7c3aed">SUMMARIZE — Using only this material, summarize ___. Include ___. Keep under ___.</text><line x1="95" y1="494" x2="1100" y2="494" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="534" x2="1100" y2="534" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="594" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="642" font-family="Arial" font-size="28" font-weight="800" fill="#7c3aed">EXTRACT — From this text, pull out only ___. Return as a table/checklist.</text><line x1="95" y1="676" x2="1100" y2="676" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="716" x2="1100" y2="716" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="776" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="824" font-family="Arial" font-size="28" font-weight="800" fill="#7c3aed">TRANSFORM — Rewrite my material for ___ audience/tone/format. Keep facts unchanged.</text><line x1="95" y1="858" x2="1100" y2="858" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="898" x2="1100" y2="898" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="958" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1006" font-family="Arial" font-size="28" font-weight="800" fill="#7c3aed">COMPARE — Compare A and B using these criteria: ___. Show evidence and uncertainty.</text><line x1="95" y1="1040" x2="1100" y2="1040" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1080" x2="1100" y2="1080" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="1140" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1188" font-family="Arial" font-size="28" font-weight="800" fill="#7c3aed">CRITIQUE — Check my draft against this rubric: ___. Suggest fixes; do not rewrite everything.</text><line x1="95" y1="1222" x2="1100" y2="1222" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1262" x2="1100" y2="1262" stroke="#cbd5e1" stroke-width="2"/><text x="65" y="1550" font-family="Arial" font-size="21" font-weight="700" fill="#64748b">V79 Junior AI Academy • Think • Ask • Check • Improve • Reuse</text></svg>