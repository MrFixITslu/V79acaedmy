<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="170" fill="#c2410c"/><text x="65" y="72" font-family="Arial" font-size="50" font-weight="900" fill="#fff">AI Output Quality Audit</text><text x="65" y="120" font-family="Arial" font-size="24" font-weight="600" fill="#fff">Do not ask only “Is this good?” Check it against real criteria.</text><rect x="65" y="230" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="278" font-family="Arial" font-size="28" font-weight="800" fill="#c2410c">Goal / audience / definition of done</text><line x1="95" y1="312" x2="1100" y2="312" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="352" x2="1100" y2="352" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="412" width="1070" height="198" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="460" font-family="Arial" font-size="28" font-weight="800" fill="#c2410c">Accuracy — which claims were verified?</text><line x1="95" y1="494" x2="1100" y2="494" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="534" x2="1100" y2="534" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="574" x2="1100" y2="574" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="634" width="1070" height="198" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="682" font-family="Arial" font-size="28" font-weight="800" fill="#c2410c">Instruction check — what did AI miss?</text><line x1="95" y1="716" x2="1100" y2="716" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="756" x2="1100" y2="756" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="796" x2="1100" y2="796" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="856" width="1070" height="198" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="904" font-family="Arial" font-size="28" font-weight="800" fill="#c2410c">Safety / privacy / permission / attribution</text><li