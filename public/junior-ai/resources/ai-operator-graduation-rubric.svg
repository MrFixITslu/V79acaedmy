<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#f8fafc"/>
<rect width="1200" height="190" fill="#312e81"/>
<text x="70" y="76" font-family="Arial" font-size="50" font-weight="900" fill="#fff">AI Operator Graduation Rubric</text>
<text x="70" y="126" font-family="Arial" font-size="24" font-weight="600" fill="#e0e7ff">Mission 16 • Score the process, not just the polish of the final output</text>
<text x="70" y="220" font-family="Arial" font-size="22" font-weight="800" fill="#0f172a">Scale: 4 = Independent &amp; strong • 3 = Competent • 2 = Developing • 1 = Needs guided support</text>
<rect x="65" y="285" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="327" font-family="Arial" font-size="26" font-weight="900" fill="#312e81">DEFINE + CHOOSE</text><foreignObject x="95" y="342" width="760" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">States the real result, chooses an appropriate AI operation/tool, and explains why AI is or is not useful.</div></foreignObject><text x="900" y="330" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="352" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="387" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="475" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="517" font-family="Arial" font-size="26" font-weight="900" fill="#312e81">PROMPT + CONTEXT</text><foreignObject x="95" y="532" width="760" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Gives relevant context, constraints and output format without unnecessary information.</div></foreignObject><text x="900" y="520" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="542" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="577" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="665" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="707" font-family="Arial" font-size="26" font-weight="900" fill="#312e81">CHECK + VERIFY</text><foreignObject x="95" y="722" width="760" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Checks instructions, facts/evidence, uncertainty, privacy, permission and quality using explicit criteria.</div></foreignObject><text x="900" y="710" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="732" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="767" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="855" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="897" font-family="Arial" font-size="26" font-weight="900" fill="#312e81">IMPROVE</text><foreignObject x="95" y="912" width="760" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Identifies the highest-impact weakness and fixes it with a focused follow-up while preserving good parts.</div></foreignObject><text x="900" y="900" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="922" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="957" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="1045" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1087" font-family="Arial" font-size="26" font-weight="900" fill="#312e81">SAVE + TRANSFER</text><foreignObject x="95" y="1102" width="760" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Saves a reusable prompt/checklist/workflow and can adapt it to a different task.</div></foreignObject><text x="900" y="1090" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="1112" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="1147" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="1235" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1277" font-family="Arial" font-size="26" font-weight="900" fill="#312e81">EXPLAIN + RESPONSIBILITY</text><foreignObject x="95" y="1292" width="760" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Explains what AI did, what the human decided, and when AI should not be used.</div></foreignObject><text x="900" y="1280" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="1302" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="1337" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text>
<rect x="65" y="1450" width="1070" height="95" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
<text x="95" y="1486" font-family="Arial" font-size="23" font-weight="900" fill="#155e75">Recommended pass standard</text>
<text x="95" y="1520" font-family="Arial" font-size="20" font-weight="600" fill="#334155">No category below 3. If any area is developing, return Needs Changes with one clear next step.</text>
</svg>