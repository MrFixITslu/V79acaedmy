<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="170" fill="#0369a1"/><text x="65" y="72" font-family="Arial" font-size="50" font-weight="900" fill="#fff">Should I Use AI?</text><text x="65" y="120" font-family="Arial" font-size="24" font-weight="600" fill="#fff">Choose the tool before you start prompting.</text><rect x="65" y="230" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="278" font-family="Arial" font-size="28" font-weight="800" fill="#0369a1">1. What result do I need?</text><line x1="95" y1="312" x2="1100" y2="312" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="352" x2="1100" y2="352" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="412" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="460" font-family="Arial" font-size="28" font-weight="800" fill="#0369a1">2. Could a simpler tool or trusted person do this better?</text><line x1="95" y1="494" x2="1100" y2="494" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="534" x2="1100" y2="534" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="594" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="642" font-family="Arial" font-size="28" font-weight="800" fill="#0369a1">3. What small part could AI help with?</text><line x1="95" y1="676" x2="1100" y2="676" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="716" x2="1100" y2="716" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="776" width="1070" height="198" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="824" font-family="Arial" font-size="28" font-weight="800" fill="#0369a1">4. What must a human still check or decide?</text><line x1="95" y1="858" x2="1100" y2="858" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="898" x2="1100" y2="898" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="938" x2="1100" y2="938" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="998" width="1070" height="158" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1046" font-family="Arial" font-size="28" font-weight="800" fill="#0369a1">5. What private information must stay out?</text><line x1="95" y1="1080" x2="1100" y2="1080" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1120" x2="1100" y2="1120" stroke="#cbd5e1" stroke-width="2"/><text x="65" y="1550" font-family="Arial" font-size="21" font-weight="700" fill="#64748b">V79 Junior AI Academy • Think • Ask • Check • Improve • Reuse</text></svg>