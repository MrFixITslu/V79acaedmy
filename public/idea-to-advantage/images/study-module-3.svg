<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">Revenue, cost and break-even</title><desc id="desc">Illustrative monthly data: price EC$100, variable cost EC$60 and fixed costs EC$4,000. At 0 units revenue/cost are 0/4,000; at 80 they are 8,000/8,800; at 100 they are 10,000/10,000; at 120 they are 12,000/11,200. A capacity of 80 is below the 100-unit break-even point. Figures exclude unlisted costs and assume constant unit economics.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#08796f"/></marker></defs><rect width="900" height="610" fill="#fff"/><g fill="#193d35" font-family="Arial, sans-serif"><text x="36" y="54" font-size="27" font-weight="700">Revenue, cost and break-even</text><text x="36" y="584" font-size="16">V79 Academy · Teaching example · Text explanation and data accompany this visual</text><path d="M90 150V470H790" fill="none" stroke="#47615a" stroke-width="2"/><text x="90" y="502" text-anchor="middle" font-size="20">0</text><text x="323.3333333333333" y="502" text-anchor="middle" font-size="20">40</text><text x="556.6666666666666" y="502" text-anchor="middle" font-size="20">80</text><text x="673.3333333333334" y="502" text-anchor="middle" font-size="20">100</text><text x="790" y="502" text-anchor="middle" font-size="20">120</text><text x="78" y="476" text-anchor="end" font-size="18">0</text><text x="78" y="369.33333333333337" text-anchor="end" font-size="18">4000</text><text x="78" y="262.6666666666667" text-anchor="end" font-size="18">8000</text><text x="78" y="156" text-anchor="end" font-size="18">12000</text><path d="M90 470 L790 150" fill="none" stroke="#08796f" stroke-width="4"/><path d="M90 363.33333333333337 L790 171.33333333333331" fill="none" stroke="#305b98" stroke-width="4"/><circle cx="673.3333333333334" cy="203.33333333333331" r="6" fill="#193d35"/><text x="440" y="548" text-anchor="middle" font-size="22">Monthly units</text><text x="40" y="110" font-size="18">XCD</text><text x="280" y="110" fill="#08796f" font-size="20">Revenue</text><text x="480" y="110" fill="#305b98" font-size="20">Total listed cost</text></g></svg>
