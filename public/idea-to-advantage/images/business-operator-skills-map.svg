<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="190" fill="#312e81"/><text x="65" y="76" font-family="Arial" font-size="52" font-weight="900" fill="#fff">Business Operator Skills Map</text><text x="65" y="126" font-family="Arial" font-size="24" font-weight="600" fill="#e0e7ff">DEFINE → MODEL → TEST → CONTROL → MEASURE → IMPROVE</text><rect x="70" y="250" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="296" font-family="Arial" font-size="30" font-weight="900" fill="#4f46e5">DEFINE</text><foreignObject x="100" y="316" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">State the real management decision, customer problem or constraint.</div></foreignObject><rect x="70" y="440" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="486" font-family="Arial" font-size="30" font-weight="900" fill="#4f46e5">MODEL</text><foreignObject x="100" y="506" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Make customer, cash, capacity, cost and risk assumptions visible.</div></foreignObject><rect x="70" y="630" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="676" font-family="Arial" font-size="30" font-weight="900" fill="#4f46e5">TEST</text><foreignObject x="100" y="696" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Use evidence or a low-cost experiment to challenge the weakest assumption.</div></foreignObject><rect x="70" y="820" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="866" font-family="Arial" font-size="30" font-weight="900" fill="#4f46e5">CONTROL</text><foreignObject x="100" y="886" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Create owners, rules, authority limits, checklists and escalation paths.</div></foreignObject><rect x="70" y="1010" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="1056" font-family="Arial" font-size="30" font-weight="900" fill="#4f46e5">MEASURE</text><foreignObject x="100" y="1076" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Track the few indicators that change a decision—not vanity metrics.</div></foreignObject><rect x="70" y="1200" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="1246" font-family="Arial" font-size="30" font-weight="900" fill="#4f46e5">IMPROVE</text><foreignObject x="100" y="1266" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Use results to continue, change, stop or sequence the next action.</div></foreignObject><text x="70" y="1480" font-family="Arial" font-size="23" font-weight="900" fill="#0f172a">Graduate test</text><text x="70" y="1517" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Can you diagnose a new business scenario, quantify the decision, build controls and defend the next 90 days using evidence?</text></svg>