<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">An average can hide a weak category</title><desc id="desc">Illustrative diagnostic: finance is 40% and the other seven categories are 80%. With the course’s 20% finance weight, the overall score is 72%. Read category results alongside the total; these are self-assessment inputs, not audited performance.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#08796f"/></marker></defs><rect width="900" height="610" fill="#fff"/><g fill="#193d35" font-family="Arial, sans-serif"><text x="36" y="54" font-size="27" font-weight="700">An average can hide a weak category</text><text x="36" y="584" font-size="16">V79 Academy · Teaching example · Text explanation and data accompany this visual</text><text x="36" y="130" font-size="21">Finance 40%</text><rect x="280" y="110" width="240" height="28" rx="4" fill="#8a471e"/><text x="36" y="178" font-size="21">Customers 80%</text><rect x="280" y="158" width="480" height="28" rx="4" fill="#08796f"/><text x="36" y="226" font-size="21">Marketing 80%</text><rect x="280" y="206" width="480" height="28" rx="4" fill="#08796f"/><text x="36" y="274" font-size="21">Operations 80%</text><rect x="280" y="254" width="480" height="28" rx="4" fill="#08796f"/><text x="36" y="322" font-size="21">Inventory 80%</text><rect x="280" y="302" width="480" height="28" rx="4" fill="#08796f"/><text x="36" y="370" font-size="21">Digital / AI 80%</text><rect x="280" y="350" width="480" height="28" rx="4" fill="#08796f"/><text x="36" y="418" font-size="21">People 80%</text><rect x="280" y="398" width="480" height="28" rx="4" fill="#08796f"/><text x="36" y="466" font-size="21">Resilience 80%</text><rect x="280" y="446" width="480" height="28" rx="4" fill="#08796f"/></g></svg>
