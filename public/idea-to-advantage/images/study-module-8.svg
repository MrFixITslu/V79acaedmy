<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">An AI draft needs an approval boundary</title><desc id="desc">Use approved, appropriate input to create a draft; a named person checks it against authoritative records before release. Keep a manual fallback and stop rule. This is a workflow diagram, not a claim that a model internally reasons in four reliable steps.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#08796f"/></marker></defs><rect width="900" height="610" fill="#fff"/><g fill="#193d35" font-family="Arial, sans-serif"><text x="36" y="54" font-size="27" font-weight="700">An AI draft needs an approval boundary</text><text x="36" y="584" font-size="16">V79 Academy · Teaching example · Text explanation and data accompany this visual</text><rect x="40" y="130" width="395" height="130" rx="14" fill="#edf4ef" stroke="#b0c4b8"/><text x="62" y="169" font-size="17" fill="#46655b">STEP 1</text><text x="62" y="213" font-size="21">Approved input</text><rect x="465" y="130" width="395" height="130" rx="14" fill="#edf4ef" stroke="#b0c4b8"/><text x="487" y="169" font-size="17" fill="#46655b">STEP 2</text><text x="487" y="213" font-size="21">AI-assisted draft</text><rect x="465" y="350" width="395" height="130" rx="14" fill="#edf4ef" stroke="#b0c4b8"/><text x="487" y="389" font-size="17" fill="#46655b">STEP 3</text><text x="487" y="433" font-size="21">Human verification</text><rect x="40" y="350" width="395" height="130" rx="14" fill="#edf4ef" stroke="#b0c4b8"/><text x="62" y="389" font-size="17" fill="#46655b">STEP 4</text><text x="62" y="433" font-size="21">Approved release / fallback</text><path d="M438 195H460M660 268V340M457 415H440" fill="none" stroke="#08796f" stroke-width="3" marker-end="url(#arrow)"/></g></svg>
