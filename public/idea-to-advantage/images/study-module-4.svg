<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">Follow the timing of cash</title><desc id="desc">Illustrative sequence: opening cash EC$2,000, cash receipts 1,000, expense payments 3,000 and equipment payment 2,000 give closing cash −2,000. An invoice for EC$6,000 is not a cash receipt until collected. The forecast exposes a gap; it does not choose the right funding response.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#08796f"/></marker></defs><rect width="900" height="610" fill="#fff"/><g fill="#193d35" font-family="Arial, sans-serif"><text x="36" y="54" font-size="27" font-weight="700">Follow the timing of cash</text><text x="36" y="584" font-size="16">V79 Academy · Teaching example · Text explanation and data accompany this visual</text><rect x="40" y="130" width="395" height="130" rx="14" fill="#edf4ef" stroke="#b0c4b8"/><text x="62" y="169" font-size="17" fill="#46655b">STEP 1</text><text x="62" y="213" font-size="21">Opening cash 2,000</text><rect x="465" y="130" width="395" height="130" rx="14" fill="#edf4ef" stroke="#b0c4b8"/><text x="487" y="169" font-size="17" fill="#46655b">STEP 2</text><text x="487" y="213" font-size="21">Receipts +1,000</text><rect x="465" y="350" width="395" height="130" rx="14" fill="#edf4ef" stroke="#b0c4b8"/><text x="487" y="389" font-size="17" fill="#46655b">STEP 3</text><text x="487" y="433" font-size="21">Payments −5,000</text><rect x="40" y="350" width="395" height="130" rx="14" fill="#edf4ef" stroke="#b0c4b8"/><text x="62" y="389" font-size="17" fill="#46655b">STEP 4</text><text x="62" y="433" font-size="21">Closing cash −2,000</text><path d="M438 195H460M660 268V340M457 415H440" fill="none" stroke="#08796f" stroke-width="3" marker-end="url(#arrow)"/></g></svg>
