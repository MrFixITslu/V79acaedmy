<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="180" fill="#0f766e"/><text x="65" y="72" font-family="Arial" font-size="50" font-weight="900" fill="#fff">Decision Evidence Sheet</text><text x="65" y="122" font-family="Arial" font-size="24" font-weight="600" fill="#ccfbf1">Use after each module: baseline → decision → action → measure → result → next decision</text><rect x="65" y="230" width="1070" height="154" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="270" font-family="Arial" font-size="25" font-weight="900" fill="#0f766e">Decision / problem</text><text x="95" y="298" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">What exact management decision are you making?</text><line x1="95" y1="326" x2="1100" y2="326" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="354" x2="1100" y2="354" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="382" x2="1100" y2="382" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="440" width="1070" height="182" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="480" font-family="Arial" font-size="25" font-weight="900" fill="#0f766e">Baseline evidence</text><text x="95" y="508" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">What numbers, customer behaviour, records or observations show the current reality?</text><line x1="95" y1="536" x2="1100" y2="536" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="564" x2="1100" y2="564" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="592" x2="1100" y2="592" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="620" x2="1100" y2="620" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="650" width="1070" height="182" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="690" font-family="Arial" font-size="25" font-weight="900" fill="#0f766e">Assumptions / uncertainty</text><text x="95" y="718" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">What do you believe but not yet know?</text><line x1="95" y1="746" x2="1100" y2="746" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="774" x2="1100" y2="774" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="802" x2="1100" y2="802" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="830" x2="1100" y2="830" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="860" width="1070" height="154" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="900" font-family="Arial" font-size="25" font-weight="900" fill="#0f766e">Action / owner / date</text><text x="95" y="928" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">What will be done, by whom and by when?</text><line x1="95" y1="956" x2="1100" y2="956" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="984" x2="1100" y2="984" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1012" x2="1100" y2="1012" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="1070" width="1070" height="182" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1110" font-family="Arial" font-size="25" font-weight="900" fill="#0f766e">Measure / target / stop rule</text><text x="95" y="1138" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">What result changes the decision?</text><line x1="95" y1="1166" x2="1100" y2="1166" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1194" x2="1100" y2="1194" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1222" x2="1100" y2="1222" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1250" x2="1100" y2="1250" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="1280" width="1070" height="182" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1320" font-family="Arial" font-size="25" font-weight="900" fill="#0f766e">Result / next decision</text><text x="95" y="1348" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">What happened? Continue, change, stop or sequence?</text><line x1="95" y1="1376" x2="1100" y2="1376" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1404" x2="1100" y2="1404" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1432" x2="1100" y2="1432" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1460" x2="1100" y2="1460" stroke="#cbd5e1" stroke-width="2"/></svg>