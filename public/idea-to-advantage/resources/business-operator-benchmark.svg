<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="185" fill="#7c2d12"/><text x="65" y="72" font-family="Arial" font-size="50" font-weight="900" fill="#fff">Business Operator Benchmark</text><text x="65" y="122" font-family="Arial" font-size="24" font-weight="600" fill="#ffedd5">Module 12 • New growth opportunity + business shock + 90-day response</text><rect x="65" y="235" width="1070" height="149" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="273" font-family="Arial" font-size="24" font-weight="900" fill="#7c2d12">1. DEFINE</text><text x="95" y="301" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">What is the actual decision and current constraint?</text><line x1="95" y1="329" x2="1100" y2="329" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="357" x2="1100" y2="357" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="385" x2="1100" y2="385" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="400" width="1070" height="205" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="438" font-family="Arial" font-size="24" font-weight="900" fill="#7c2d12">2. MODEL</text><text x="95" y="466" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">Show the customer, cash, margin, capacity and risk assumptions that matter.</text><line x1="95" y1="494" x2="1100" y2="494" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="522" x2="1100" y2="522" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="550" x2="1100" y2="550" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="578" x2="1100" y2="578" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="606" x2="1100" y2="606" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="625" width="1070" height="177" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="663" font-family="Arial" font-size="24" font-weight="900" fill="#7c2d12">3. TEST</text><text x="95" y="691" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">Which assumption is weakest? What evidence exists or what experiment would you run?</text><line x1="95" y1="719" x2="1100" y2="719" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="747" x2="1100" y2="747" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="775" x2="1100" y2="775" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="803" x2="1100" y2="803" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="840" width="1070" height="177" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="878" font-family="Arial" font-size="24" font-weight="900" fill="#7c2d12">4. CONTROL</text><text x="95" y="906" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">Who owns the action? What rules, limits, process or escalation must exist?</text><line x1="95" y1="934" x2="1100" y2="934" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="962" x2="1100" y2="962" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="990" x2="1100" y2="990" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1018" x2="1100" y2="1018" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="1055" width="1070" height="177" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1093" font-family="Arial" font-size="24" font-weight="900" fill="#7c2d12">5. MEASURE</text><text x="95" y="1121" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">Which KPIs and thresholds will tell you whether the plan is working?</text><line x1="95" y1="1149" x2="1100" y2="1149" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1177" x2="1100" y2="1177" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1205" x2="1100" y2="1205" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1233" x2="1100" y2="1233" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="1270" width="1070" height="205" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1308" font-family="Arial" font-size="24" font-weight="900" fill="#7c2d12">6. IMPROVE</text><text x="95" y="1336" font-family="Arial" font-size="18" font-weight="600" fill="#64748b">Give the 90-day priority plan, stop/change rules and next review date.</text><line x1="95" y1="1364" x2="1100" y2="1364" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1392" x2="1100" y2="1392" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1420" x2="1100" y2="1420" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1448" x2="1100" y2="1448" stroke="#cbd5e1" stroke-width="2"/><line x1="95" y1="1476" x2="1100" y2="1476" stroke="#cbd5e1" stroke-width="2"/></svg>