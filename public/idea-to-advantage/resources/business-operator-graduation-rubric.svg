<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="190" fill="#1e3a8a"/><text x="65" y="76" font-family="Arial" font-size="50" font-weight="900" fill="#fff">Business Operator Graduation Rubric</text><text x="65" y="126" font-family="Arial" font-size="24" font-weight="600" fill="#dbeafe">Score the quality of the decision process, not the confidence of the presentation</text><text x="65" y="220" font-family="Arial" font-size="21" font-weight="800" fill="#0f172a">Scale: 4 = Independent &amp; strong • 3 = Competent • 2 = Developing • 1 = Needs guided support</text><rect x="65" y="280" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="322" font-family="Arial" font-size="26" font-weight="900" fill="#1e3a8a">DEFINE + PRIORITIZE</text><foreignObject x="95" y="338" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Identifies the real constraint/decision and prioritizes it using evidence rather than urgency alone.</div></foreignObject><text x="900" y="325" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="348" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="383" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="470" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="512" font-family="Arial" font-size="26" font-weight="900" fill="#1e3a8a">MODEL + NUMBERS</text><foreignObject x="95" y="528" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Makes financial, customer, capacity and risk assumptions visible and uses correct basic calculations.</div></foreignObject><text x="900" y="515" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="538" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="573" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="660" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="702" font-family="Arial" font-size="26" font-weight="900" fill="#1e3a8a">TEST + EVIDENCE</text><foreignObject x="95" y="718" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Separates fact from assumption and proposes/uses credible evidence or experiments.</div></foreignObject><text x="900" y="705" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="728" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="763" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="850" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="892" font-family="Arial" font-size="26" font-weight="900" fill="#1e3a8a">CONTROL + OWNERSHIP</text><foreignObject x="95" y="908" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Defines owners, authority, process controls, limits and escalation.</div></foreignObject><text x="900" y="895" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="918" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="953" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="1040" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1082" font-family="Arial" font-size="26" font-weight="900" fill="#1e3a8a">MEASURE + DECIDE</text><foreignObject x="95" y="1098" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Selects decision-relevant KPIs, targets and continue/change/stop rules.</div></foreignObject><text x="900" y="1085" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="1108" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="1143" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="1230" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1272" font-family="Arial" font-size="26" font-weight="900" fill="#1e3a8a">TRANSFER + EXPLAIN</text><foreignObject x="95" y="1288" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Integrates multiple business areas and defends a realistic 90-day response in their own words.</div></foreignObject><text x="900" y="1275" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="1298" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="1333" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="1450" width="1070" height="90" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="95" y="1487" font-family="Arial" font-size="23" font-weight="900" fill="#1e40af">Recommended pass standard</text><text x="95" y="1520" font-family="Arial" font-size="20" font-weight="600" fill="#334155">No category below 3. Developing areas should be corrected and demonstrated again.</text></svg>