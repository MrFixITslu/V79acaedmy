<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" role="img"><title>Small-business topology: client, switch, router and remote network</title><rect width="650" height="300" fill="#e9efeb"/><path d="M100 140H540M265 140V55" stroke="#88b4a1" stroke-width="3" fill="none"/><rect x="40" y="100" width="100" height="80" rx="10" fill="white"/><text x="90" y="147" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#204337">Client</text><rect x="205" y="100" width="100" height="80" rx="10" fill="white"/><text x="255" y="147" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#204337">Switch</text><rect x="370" y="100" width="100" height="80" rx="10" fill="#075e59"/><text x="420" y="147" text-anchor="middle" font-size="20" font-family="sans-serif" fill="white">Router</text><rect x="535" y="100" width="100" height="80" rx="10" fill="white"/><text x="585" y="147" text-anchor="middle" font-size="20" font-family="sans-serif" fill="#204337">WAN</text><rect x="220" y="28" width="90" height="45" rx="8" fill="white"/><text x="265" y="57" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#204337">Printer</text><text x="32" y="250" font-size="27" font-family="sans-serif" fill="#204337">Connect. Measure. Troubleshoot.</text></svg>