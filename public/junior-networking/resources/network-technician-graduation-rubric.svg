<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="185" fill="#075985"/><text x="65" y="72" font-family="Arial" font-size="50" font-weight="900" fill="#fff">Network Technician Graduation Rubric</text><text x="65" y="122" font-family="Arial" font-size="24" font-weight="600" fill="#e0f2fe">Mission 20 • Score the process and evidence, not only the final topology</text><text x="65" y="220" font-family="Arial" font-size="21" font-weight="800" fill="#0f172a">Scale: 4 = Independent &amp; strong • 3 = Competent • 2 = Developing • 1 = Needs guided support</text><rect x="65" y="280" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="322" font-family="Arial" font-size="26" font-weight="900" fill="#075985">SCOPE + MODEL</text><foreignObject x="95" y="338" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Defines the symptom/requirement and identifies the relevant devices, layers, services and boundaries.</div></foreignObject><text x="900" y="325" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="348" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="383" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="470" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="512" font-family="Arial" font-size="26" font-weight="900" fill="#075985">TEST + EVIDENCE</text><foreignObject x="95" y="528" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Chooses efficient tests, interprets results correctly and avoids unsupported assumptions.</div></foreignObject><text x="900" y="515" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="538" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="573" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="660" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="702" font-family="Arial" font-size="26" font-weight="900" fill="#075985">IMPLEMENT + SAFETY</text><foreignObject x="95" y="718" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Makes controlled, authorized changes with rollback/escalation awareness.</div></foreignObject><text x="900" y="705" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="728" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="763" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="850" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="892" font-family="Arial" font-size="26" font-weight="900" fill="#075985">VERIFY</text><foreignObject x="95" y="908" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Records expected vs actual results, including negative/security tests where relevant.</div></foreignObject><text x="900" y="895" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="918" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="953" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="1040" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1082" font-family="Arial" font-size="26" font-weight="900" fill="#075985">DOCUMENT + HANDOFF</text><foreignObject x="95" y="1098" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Updates diagrams, addressing/configuration notes, risk and change evidence so another technician can continue.</div></foreignObject><text x="900" y="1085" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="1108" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="1143" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="1230" width="1070" height="155" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="95" y="1272" font-family="Arial" font-size="26" font-weight="900" fill="#075985">TRANSFER + EXPLAIN</text><foreignObject x="95" y="1288" width="760" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:20px;font-weight:600;line-height:1.25">Solves an unfamiliar fault/design change and explains tradeoffs, root cause and next steps in their own words.</div></foreignObject><text x="900" y="1275" font-family="Arial" font-size="22" font-weight="800" fill="#475569">Score</text><rect x="900" y="1298" width="150" height="55" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1070" y="1333" font-family="Arial" font-size="18" font-weight="700" fill="#64748b">/4</text><rect x="65" y="1450" width="1070" height="90" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="95" y="1487" font-family="Arial" font-size="23" font-weight="900" fill="#155e75">Recommended pass standard</text><text x="95" y="1520" font-family="Arial" font-size="20" font-weight="600" fill="#334155">No category below 3. Developing areas should be corrected and demonstrated again.</text></svg>