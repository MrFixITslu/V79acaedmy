<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600"><rect width="1200" height="1600" fill="#f8fafc"/><rect width="1200" height="185" fill="#0f172a"/><text x="65" y="72" font-family="Arial" font-size="52" font-weight="900" fill="#fff">Network Technician Skills Map</text><text x="65" y="122" font-family="Arial" font-size="24" font-weight="600" fill="#a5f3fc">UNDERSTAND → TRACE/TEST → BUILD → VERIFY → DOCUMENT → TRANSFER</text><rect x="70" y="245" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="293" font-family="Arial" font-size="30" font-weight="900" fill="#0369a1">UNDERSTAND</text><foreignObject x="100" y="313" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Explain what each device, protocol and layer is responsible for.</div></foreignObject><rect x="70" y="435" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="483" font-family="Arial" font-size="30" font-weight="900" fill="#0369a1">TRACE / TEST</text><foreignObject x="100" y="503" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Use evidence to narrow the fault domain instead of guessing.</div></foreignObject><rect x="70" y="625" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="673" font-family="Arial" font-size="30" font-weight="900" fill="#0369a1">BUILD</text><foreignObject x="100" y="693" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Implement physical, switching, routing, wireless and security requirements in controlled steps.</div></foreignObject><rect x="70" y="815" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="863" font-family="Arial" font-size="30" font-weight="900" fill="#0369a1">VERIFY</text><foreignObject x="100" y="883" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Prove both what should work and what should remain blocked or fail safely.</div></foreignObject><rect x="70" y="1005" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="1053" font-family="Arial" font-size="30" font-weight="900" fill="#0369a1">DOCUMENT</text><foreignObject x="100" y="1073" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Keep diagrams, labels, addressing, test results, risks and changes current.</div></foreignObject><rect x="70" y="1195" width="1060" height="145" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="100" y="1243" font-family="Arial" font-size="30" font-weight="900" fill="#0369a1">TRANSFER</text><foreignObject x="100" y="1263" width="940" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial;color:#475569;font-size:22px;font-weight:600;line-height:1.25">Solve an unfamiliar fault or design change and explain the reasoning in your own words.</div></foreignObject><text x="70" y="1475" font-family="Arial" font-size="23" font-weight="900" fill="#0f172a">Graduate test</text><text x="70" y="1512" font-family="Arial" font-size="21" font-weight="600" fill="#475569">Can you diagnose or redesign a network you have not seen before using evidence, safe changes and complete handoff documentation?</text></svg>